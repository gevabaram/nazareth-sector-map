let current=null,last=null,watchId=null,follow=false,mode='street',marker=null,accCircle=null;const polys={},labels={};const map=L.map('map',{zoomControl:true}).setView([32.7085,35.296],13);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
function style(s,a){return{color:s.c,weight:a?4:2.5,opacity:a?1:.92,fillColor:s.c,fillOpacity:a ? .43 : .30}}function center(x){let a=0,b=0;x.forEach(p=>{a+=p[0];b+=p[1]});return[a/x.length,b/x.length]}function draw(){Object.entries(sectors).forEach(([k,s])=>{polys[k]=L.polygon(s.x,style(s,false)).addTo(map);labels[k]=L.marker(center(s.x),{interactive:false,icon:L.divIcon({className:'sector-label',html:`<div>${s.l}</div>`,iconSize:[44,44],iconAnchor:[22,22]})}).addTo(map)});document.getElementById('legend').innerHTML=Object.values(sectors).map(s=>`<div class="li"><div class="ll" style="background:${s.c}">${s.l}</div><div><div class="ln">${s.n}</div><div class="lp">${s.p.length?s.p.join(' • '):'ללא רשימת שכונות מאומתת'}</div></div></div>`).join('')}function pip(lat,lng,p){let z=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][1],yi=p[i][0],xj=p[j][1],yj=p[j][0];if(((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi+1e-12)+xi))z=!z}return z}function detect(lat,lng){for(const k in sectors)if(pip(lat,lng,sectors[k].x))return k;return null}function highlight(){for(const k in sectors)polys[k].setStyle(style(sectors[k],k===current))}function update(pos){const{latitude:lat,longitude:lng,accuracy}=pos.coords;last={lat,lng,accuracy,time:Date.now()};if(!marker){marker=L.marker([lat,lng],{zIndexOffset:2000,icon:L.divIcon({className:'',html:'<div class="udot"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);accCircle=L.circle([lat,lng],{radius:accuracy,color:'#2563eb',weight:1,fillColor:'#60a5fa',fillOpacity:.12}).addTo(map)}else{marker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng]).setRadius(accuracy)}const n=detect(lat,lng);if(n!==current){current=n;highlight();if(navigator.vibrate)navigator.vibrate(50)}status();if(follow)map.panTo([lat,lng])}function err(e){let m='לא ניתן לקבל מיקום';if(e.code===1)m='הרשאת מיקום נדחתה – אפשר אותה בהגדרות הדפדפן';if(e.code===2)m='המיקום אינו זמין כרגע';if(e.code===3)m='זמן קבלת המיקום הסתיים';document.getElementById
