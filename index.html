<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font-family:Arial,system-ui,sans-serif;background:#e2e8f0;color:#0f172a;overflow:hidden}.top{height:64px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding:env(safe-area-inset-top) 14px 0;position:relative;z-index:1000;box-shadow:0 2px 14px #0f172a55}.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:#ffffff20;display:grid;place-items:center;font-weight:900}.title{font-weight:900;font-size:17px}.sub{font-size:12px;opacity:.72;margin-top:3px}.sub.embossed{font-weight:600;letter-spacing:.15px;color:rgba(226,232,240,.76);text-shadow:0 1px 0 rgba(255,255,255,.16),0 -1px 0 rgba(0,0,0,.48)}.menuBtn{width:42px;height:42px;border:0;border-radius:13px;background:#ffffff18;color:#fff;font-size:20px}.wrap{height:calc(100% - 64px);position:relative}#map{height:100%;width:100%}.quick{position:absolute;top:14px;left:50%;right:auto;transform:translateX(-50%);z-index:850;display:flex;gap:8px;white-space:nowrap}.mini{height:40px;border:1px solid rgba(255,255,255,.48);border-radius:13px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(241,245,249,.72));color:#0f172a;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(15,23,42,.07),0 8px 24px #0f172a2e;padding:0 12px;font-weight:800;font-size:12px;backdrop-filter:blur(12px) saturate(145%);-webkit-backdrop-filter:blur(12px) saturate(145%)}.mini.primary{background:linear-gradient(145deg,rgba(59,130,246,.92),rgba(37,99,235,.78));color:#fff}.mini.green{background:linear-gradient(145deg,rgba(34,197,94,.90),rgba(22,163,74,.76));color:#fff}.mini:disabled{opacity:.45}.controlCluster{position:absolute;right:14px;top:64px;z-index:900;width:168px;height:52px;pointer-events:none}.hub{pointer-events:auto;position:absolute;right:0;top:0;width:52px;height:52px;border:1px solid rgba(255,255,255,.42);border-radius:16px;background:linear-gradient(145deg,rgba(30,41,59,.88),rgba(15,23,42,.76));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.22),0 12px 28px #0f172a55;backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);font-size:22px}.menuStack{display:none;position:absolute;right:0;top:60px;flex-direction:column;gap:8px;pointer-events:auto}.menuStack.open{display:flex}.actionBtn{width:164px;min-height:52px;border:1px solid #dbe3ed;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(241,245,249,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(15,23,42,.07),0 8px 20px #0f172a22;backdrop-filter:blur(12px) saturate(145%);-webkit-backdrop-filter:blur(12px) saturate(145%);display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;padding:8px 10px;text-align:right}.actionBtn .ico{width:32px;height:32px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-size:16px}.actionBtn b{display:block;font-size:13px}.actionBtn small{display:block;color:#64748b;font-size:10px;line-height:1.2;margin-top:2px}.actionBtn.active{background:#0f172a;color:#fff}.actionBtn.active small{color:#cbd5e1}.statusCard{position:absolute;z-index:850;right:14px;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(145deg,rgba(255,255,255,.89),rgba(248,250,252,.76));border:1px solid rgba(255,255,255,.62);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 40px #0f172a2e;padding:10px 12px;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;backdrop-filter:blur(10px)}.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#475569;color:#fff;font-weight:900;font-size:21px;border:4px solid #ffffffcc}.status{font-weight:900;font-size:15px}.meta{font-size:11px;color:#64748b;margin-top:4px}.drawer{position:fixed;top:0;right:0;height:100%;width:min(390px,92vw);z-index:1300;background:#fff;box-shadow:-20px 0 50px #0f172a3b;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;transform:translateX(105%);transition:.22s;overflow:auto}.drawer.open{transform:none}.back{position:fixed;inset:0;z-index:1250;background:#0f172a66}.dh{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #e2e8f0}.dt{font-size:20px;font-weight:900}.ds{font-size:12px;color:#64748b;margin-top:4px}.close{width:36px;height:36px;border:0;border-radius:12px;background:#f1f5f9}.sec{padding:17px 0;border-bottom:1px solid #e2e8f0}.sec h3{font-size:14px;margin:0 0 11px}.legend{display:flex;flex-direction:column;gap:9px}.li{border:1px solid #e2e8f0;border-radius:14px;padding:10px;display:grid;grid-template-columns:36px 1fr;gap:10px}.ll{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900}.ln{font-size:13px;font-weight:900}.lp{font-size:11px;color:#64748b;line-height:1.45;margin-top:3px}.privacy{font-size:12px;color:#64748b;line-height:1.55}.toast{position:fixed;z-index:1500;left:50%;bottom:100px;transform:translate(-50%,15px);opacity:0;background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.sector-label div{width:42px;height:42px;border-radius:50%;background:#0b0b0b;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;border:3px solid #ffffffdd;box-shadow:0 4px 12px #0004}.udot{width:20px;height:20px;background:#2563eb;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 8px #2563eb33,0 3px 10px #0004}.gpsPulse{animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #2563eb55}70%{box-shadow:0 0 0 14px #2563eb00}100%{box-shadow:0 0 0 0 #2563eb00}}.sectorPicker{position:absolute;z-index:980;top:126px;right:14px;width:230px;background:#fffffff7;border:1px solid #dbe3ed;border-radius:18px;box-shadow:0 14px 36px #0f172a33;padding:12px;backdrop-filter:blur(10px);display:none}.sectorPicker.open{display:block}.sectorPicker h3{margin:0 0 4px;font-size:14px}.sectorPicker .hint{font-size:10px;color:#64748b;margin-bottom:10px}.pickRow{display:flex;align-items:center;gap:9px;padding:9px 6px;border-radius:11px}.pickRow:hover{background:#f8fafc}.pickRow input{width:18px;height:18px}.pickSwatch{width:22px;height:22px;border-radius:7px;border:1px solid #0001}.pickText{font-size:12px;font-weight:800;flex:1}.pickAll{border-bottom:1px solid #e2e8f0;margin-bottom:4px;padding-bottom:10px}.pickerClose{width:100%;height:34px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-size:11px;font-weight:800;margin-top:8px}@media(max-width:640px){.quick{left:50%;right:auto;transform:translateX(-50%)}.controlCluster{right:14px;top:64px}.quick .mini{height:36px;padding:0 10px;font-size:11px}.actionBtn{width:150px}.statusCard{right:12px;left:12px;bottom:calc(10px + env(safe-area-inset-bottom))}}
</style>
</head>
<body><div id="app">
<header class="top"><div class="brand"><div class="mark">מג</div><div><div class="title">פוליגונים נצרת</div><div class="sub embossed">נוצר ע'י פלחוד צפון</div></div></div></header>
<main class="wrap">
<div id="map"></div>
<div class="quick"><button id="showLocTop" class="mini primary">הצג מיקום</button><button id="shareTop" class="mini green" disabled>שלח מיקום</button></div>
<div class="controlCluster"><button id="hub" class="hub" aria-label="פתח כלים">☰</button><div id="menuStack" class="menuStack"><button id="layer" class="actionBtn"><span class="ico">▧</span><span><b>מפה / לוויין</b><small>החלפת סוג התצוגה</small></span></button><button id="fit" class="actionBtn"><span class="ico">◉</span><span><b>בחירת פוליגונים</b><small>הצג גזרה אחת, כמה גזרות או את כולן</small></span></button><button id="editPoly" class="actionBtn"><span class="ico">✎</span><span><b>עריכת פוליגונים</b><small>צביעה ומחיקה של אזורים</small></span></button></div></div>
<div id="sectorPicker" class="sectorPicker"><h3>בחירת פוליגונים</h3><div class="hint">אפשר לבחור כמה גזרות במקביל</div><label class="pickRow pickAll"><input id="pickAll" type="checkbox" checked><span class="pickText">הצג את כל הגזרות</span></label><div id="pickList"></div><button id="pickerClose" class="pickerClose">סגור</button></div>
<section class="statusCard"><div id="badge" class="badge">—</div><div><div id="status" class="status">מאתר את המיקום שלך…</div><div id="meta" class="meta">המיקום יתעדכן אוטומטית בזמן אמת</div></div></section>
</main>
<aside id="drawer" class="drawer"><div class="dh"><div><div class="dt">גזרות ופעולות</div><div class="ds">מפה חיה ו-GPS</div></div><button id="close" class="close">✕</button></div><div class="sec"><h3>מקרא</h3><div id="legend" class="legend"></div></div><div class="sec"><h3>פרטיות</h3><div class="privacy">המיקום נשאר בדפדפן ואינו נשמר בהיסטוריה. קישור נשלח רק כשאתה לוחץ על שליחה.</div></div></aside>
<div id="back" class="back" hidden></div><div id="toast" class="toast"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const sectors={A:{l:'א',n:'גזרה א',c:'#eab308',p:['ספאפרה','בילאל','וורדים','גליל'],x:[[32.7227,35.2851],[32.7278,35.2892],[32.7317,35.2967],[32.7309,35.3058],[32.7276,35.314],[32.724,35.3202],[32.7198,35.318],[32.7184,35.311],[32.7197,35.3047],[32.7188,35.2973],[32.7204,35.291]]},B:{l:'ב',n:'גזרה ב',c:'#3b82f6',p:['שיכון אל ראם','שיכון הפועלים','כפר החורש','אל כרום','כרם סאחב'],x:[[32.7188,35.2845],[32.7212,35.2897],[32.7197,35.2972],[32.7162,35.302],[32.7105,35.3028],[32.7064,35.2984],[32.705,35.2916],[32.7079,35.286],[32.7127,35.2823],[32.7167,35.282]]},C:{l:'ג',n:'גזרה ג',c:'#f97316',p:['ביר אל אמיר','פאחורה','שכונה מזרחית',"ג'בל דולי",'חאלת אל דיר'],x:[[32.7186,35.302],[32.7201,35.3091],[32.7186,35.3171],[32.7145,35.3238],[32.708,35.326],[32.7036,35.321],[32.7003,35.3141],[32.699,35.3079],[32.6947,35.3055],[32.6912,35.3006],[32.6952,35.2973],[32.7012,35.299],[32.7057,35.3023],[32.7109,35.3025],[32.7142,35.3002]]},D:{l:'ד',n:'גזרה ד',c:'#65a30d',p:[],x:[[32.7064,35.2868],[32.7082,35.2928],[32.7057,35.2982],[32.7003,35.2992],[32.6956,35.2955],[32.6911,35.2925],[32.688,35.2852],[32.6874,35.2768],[32.6912,35.2709],[32.6969,35.2695],[32.7014,35.2733],[32.7049,35.2793]]}};
let current=null,last=null,watchId=null,mode='sat',marker=null,accCircle=null,firstFix=true;const polys={},labels={};const visibleSectors=new Set(Object.keys(sectors));
const map=L.map('map',{zoomControl:true}).setView([32.7085,35.296],13);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
function style(s,a){return{color:s.c,weight:a?4:2.5,opacity:a?1:.92,fillColor:s.c,fillOpacity:a?.42:.28}}function center(x){let a=0,b=0;x.forEach(p=>{a+=p[0];b+=p[1]});return[a/x.length,b/x.length]}function draw(){Object.entries(sectors).forEach(([k,s])=>{polys[k]=L.polygon(s.x,style(s,false)).addTo(map);labels[k]=L.marker(center(s.x),{interactive:false,icon:L.divIcon({className:'sector-label',html:`<div>${s.l}</div>`,iconSize:[42,42],iconAnchor:[21,21]})}).addTo(map)});legend.innerHTML=Object.values(sectors).map(s=>`<div class="li"><div class="ll" style="background:${s.c}">${s.l}</div><div><div class="ln">${s.n}</div><div class="lp">${s.p.length?s.p.join(' • '):'ללא רשימת שכונות מאומתת'}</div></div></div>`).join('');renderPickList()}function pip(lat,lng,p){let z=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][1],yi=p[i][0],xj=p[j][1],yj=p[j][0];if(((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi+1e-12)+xi))z=!z}return z}function detect(lat,lng){for(const k in sectors)if(pip(lat,lng,sectors[k].x))return k;return null}function highlight(){for(const k in sectors)if(polys[k])polys[k].setStyle(style(sectors[k],k===current))}function applyVisibility(){for(const k in sectors){const show=visibleSectors.has(k);if(show){if(!map.hasLayer(polys[k]))polys[k].addTo(map);if(!map.hasLayer(labels[k]))labels[k].addTo(map)}else{if(map.hasLayer(polys[k]))map.removeLayer(polys[k]);if(map.hasLayer(labels[k]))map.removeLayer(labels[k])}}}
function update(pos){const{latitude:lat,longitude:lng,accuracy,speed}=pos.coords;last={lat,lng,accuracy,time:Date.now(),speed};if(!marker){marker=L.marker([lat,lng],{zIndexOffset:2000,icon:L.divIcon({className:'',html:'<div class="udot gpsPulse"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);accCircle=L.circle([lat,lng],{radius:accuracy,color:'#2563eb',weight:1,fillColor:'#60a5fa',fillOpacity:.10}).addTo(map)}else{marker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng]).setRadius(accuracy)}const n=detect(lat,lng);if(n!==current){current=n;highlight()}updateStatus();map.panTo([lat,lng],{animate:true,duration:.35});if(firstFix){map.setView([lat,lng],16,{animate:true});firstFix=false}}
function err(e){badge.textContent='!';badge.style.background='#dc2626';status.textContent='שירותי המיקום אינם פעילים';let m='הפעל הרשאת מיקום כדי לראות את עצמך על המפה';if(e.code===1)m='יש לאפשר הרשאת מיקום לאתר בהגדרות הדפדפן';if(e.code===2)m='לא ניתן לקבל מיקום כרגע';if(e.code===3)m='קבלת המיקום ארכה יותר מדי זמן';meta.textContent=m;shareTop.disabled=true}
function startGPS(){if(!navigator.geolocation){err({code:2});return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(update,err,{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
function updateStatus(){if(!last)return;const age=Math.max(0,Math.round((Date.now()-last.time)/1000)),acc=Math.round(last.accuracy||0),sp=last.speed!=null&&last.speed>=0?` • ${Math.round(last.speed*3.6)} קמ״ש`:'';shareTop.disabled=false;if(current){const s=sectors[current];badge.textContent=s.l;badge.style.background=s.c;status.textContent=`אתה נמצא ב${s.n}`;meta.textContent=`GPS כ-${acc} מ׳${sp} • עודכן לפני ${age} שנ׳`}else{badge.textContent='!';badge.style.background='#dc2626';status.textContent='מחוץ לגבולות הגזרה';meta.textContent=`GPS כ-${acc} מ׳${sp} • עודכן לפני ${age} שנ׳`}}
function showMe(){if(last){map.setView([last.lat,last.lng],17,{animate:true});toast('מוצג המיקום הנוכחי שלך')}else startGPS()}
function share(){if(!last){toast('עדיין אין מיקום לשיתוף');return}const age=(Date.now()-last.time)/1000;if(age>60){toast('מעדכן מיקום לפני שליחה');startGPS();return}const url=`https://www.google.com/maps?q=${last.lat.toFixed(6)},${last.lng.toFixed(6)}`;const st=current?`גזרה: ${sectors[current].l}`:'מחוץ לגבולות הגזרה';window.open(`https://wa.me/?text=${encodeURIComponent('המיקום שלי כרגע:\n'+st+'\n'+url)}`,'_blank')}
function toggleLayer(){if(mode==='sat'){map.removeLayer(sat);street.addTo(map);mode='street';toast('מפת רחובות')}else{map.removeLayer(street);sat.addTo(map);mode='sat';toast('תצוגת לוויין')}}function renderPickList(){pickList.innerHTML=Object.entries(sectors).map(([k,s])=>`<label class="pickRow"><input class="sectorCheck" data-k="${k}" type="checkbox" ${visibleSectors.has(k)?'checked':''}><span class="pickSwatch" style="background:${s.c}"></span><span class="pickText">${s.n}</span></label>`).join('');document.querySelectorAll('.sectorCheck').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.k;if(cb.checked)visibleSectors.add(k);else visibleSectors.delete(k);pickAll.checked=visibleSectors.size===Object.keys(sectors).length;applyVisibility()})}
function openPicker(){sectorPicker.classList.toggle('open');menuStack.classList.remove('open')}pickAll.onchange=()=>{if(pickAll.checked)Object.keys(sectors).forEach(k=>visibleSectors.add(k));else visibleSectors.clear();renderPickList();applyVisibility()};pickerClose.onclick=()=>sectorPicker.classList.remove('open');
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),2200)}hub.onclick=()=>{menuStack.classList.toggle('open');sectorPicker.classList.remove('open')};showLocTop.onclick=showMe;shareTop.onclick=share;layer.onclick=toggleLayer;fit.onclick=openPicker;editPoly.onclick=()=>toast('עורך הפוליגונים כולל בחירת גזרה, מברשת ומחק');close.onclick=()=>{drawer.classList.remove('open');back.hidden=true};back.onclick=()=>{drawer.classList.remove('open');back.hidden=true};draw();applyVisibility();startGPS();setInterval(updateStatus,1000);
</script>
</body></html>
