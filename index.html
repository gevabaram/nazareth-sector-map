<html lang="he" dir="rtl">

<title>מפת גזרות – נצרת והסביבה</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font-family:Arial,system-ui,sans-serif;background:#e2e8f0;color:#0f172a;overflow:hidden}.top{height:64px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 14px 0;position:relative;z-index:1000;box-shadow:0 2px 14px #0f172a55}.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:#ffffff20;display:grid;place-items:center;font-weight:900}.title{font-weight:900;font-size:17px}.sub{font-size:12px;opacity:.72;margin-top:3px}.menuBtn{width:42px;height:42px;border:0;border-radius:13px;background:#ffffff18;color:#fff;font-size:20px}.wrap{height:calc(100% - 64px);position:relative}#map{height:100%;width:100%}.quick{position:absolute;top:14px;right:14px;z-index:850;display:flex;gap:8px}.mini{height:40px;border:0;border-radius:12px;background:#fff;color:#0f172a;box-shadow:0 8px 24px #0f172a2e;padding:0 12px;font-weight:800;font-size:12px}.mini.primary{background:#2563eb;color:#fff}.mini.green{background:#16a34a;color:#fff}.mini:disabled{opacity:.45}.controlCluster{position:absolute;right:14px;top:64px;z-index:900;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.hub{width:52px;height:52px;border:0;border-radius:16px;background:#0f172a;color:#fff;box-shadow:0 12px 28px #0f172a55;font-size:22px}.menuStack{display:none;flex-direction:column;gap:8px}.menuStack.open{display:flex}.actionBtn{width:164px;min-height:52px;border:1px solid #dbe3ed;border-radius:14px;background:#ffffffef;box-shadow:0 8px 20px #0f172a22;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;padding:8px 10px;text-align:right}.actionBtn .ico{width:32px;height:32px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-size:16px}.actionBtn b{display:block;font-size:13px}.actionBtn small{display:block;color:#64748b;font-size:10px;line-height:1.2;margin-top:2px}.actionBtn.active{background:#0f172a;color:#fff}.actionBtn.active small{color:#cbd5e1}.statusCard{position:absolute;z-index:850;right:14px;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#fffffff5;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 14px 40px #0f172a2e;padding:10px 12px;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;backdrop-filter:blur(10px)}.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#475569;color:#fff;font-weight:900;font-size:21px;border:4px solid #ffffffcc}.status{font-weight:900;font-size:15px}.meta{font-size:11px;color:#64748b;margin-top:4px}.drawer{position:fixed;top:0;right:0;height:100%;width:min(390px,92vw);z-index:1300;background:#fff;box-shadow:-20px 0 50px #0f172a3b;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;transform:translateX(105%);transition:.22s;overflow:auto}.drawer.open{transform:none}.back{position:fixed;inset:0;z-index:1250;background:#0f172a66}.dh{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #e2e8f0}.dt{font-size:20px;font-weight:900}.ds{font-size:12px;color:#64748b;margin-top:4px}.close{width:36px;height:36px;border:0;border-radius:12px;background:#f1f5f9}.sec{padding:17px 0;border-bottom:1px solid #e2e8f0}.sec h3{font-size:14px;margin:0 0 11px}.legend{display:flex;flex-direction:column;gap:9px}.li{border:1px solid #e2e8f0;border-radius:14px;padding:10px;display:grid;grid-template-columns:36px 1fr;gap:10px}.ll{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900}.ln{font-size:13px;font-weight:900}.lp{font-size:11px;color:#64748b;line-height:1.45;margin-top:3px}.privacy{font-size:12px;color:#64748b;line-height:1.55}.toast{position:fixed;z-index:1500;left:50%;bottom:100px;transform:translate(-50%,15px);opacity:0;background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.sector-label div{width:42px;height:42px;border-radius:50%;background:#0b0b0b;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;border:3px solid #ffffffdd;box-shadow:0 4px 12px #0004}.udot{width:20px;height:20px;background:#2563eb;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 8px #2563eb33,0 3px 10px #0004}.gpsPulse{animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #2563eb55}70%{box-shadow:0 0 0 14px #2563eb00}100%{box-shadow:0 0 0 0 #2563eb00}}
@media(max-width:640px){.quick{left:14px;right:auto}.controlCluster{right:14px;top:64px}.quick .mini{height:36px;padding:0 10px;font-size:11px}.actionBtn{width:150px}.statusCard{right:12px;left:12px;bottom:calc(10px + env(safe-area-inset-bottom))}}
</style>
</head>
<body><div id="app">
<header class="top"><div class="brand"><div class="mark">מג</div><div><div class="title">מפת גזרות</div><div class="sub">נצרת • ריינה • יפיע • עילוט</div></div></div><button id="menu" class="menuBtn">☰</button></header>
<main class="wrap">
<div id="map"></div>
<div class="quick"><button id="showLocTop" class="mini primary">הצג מיקום</button><button id="shareTop" class="mini green" disabled>שלח מיקום</button></div>
<div class="controlCluster">
<button id="hub" class="hub" aria-label="פתח כלים">☰</button>
<div id="menuStack" class="menuStack">
<button id="showLoc" class="actionBtn"><span class="ico">◎</span><span><b>הצג את המיקום שלי</b><small>ממקם אותך על המפה</small></span></button>
<button id="shareLoc" class="actionBtn"><span class="ico">↗</span><span><b>שלח את המיקום שלי</b><small>WhatsApp עם קישור למפה</small></span></button>
<button id="follow" class="actionBtn"><span class="ico">➤</span><span><b>עקוב אחרי</b><small>המפה תנוע איתך בזמן אמת</small></span></button>
<button id="layer" class="actionBtn"><span class="ico">▧</span><span><b>מפה / לוויין</b><small>החלפת סוג התצוגה</small></span></button>
<button id="fit" class="actionBtn"><span class="ico">#</span><span><b>כל הגזרות</b><small>התאם את כולן למסך</small></span></button>
<button id="editPoly" class="actionBtn"><span class="ico">✎</span><span><b>עריכת פוליגונים</b><small>צביעה ומחיקה של אזורים</small></span></button>
</div></div>
<section class="statusCard"><div id="badge" class="badge">—</div><div><div id="status" class="status">ממתין למיקום</div><div id="meta" class="meta">לחץ על "הצג מיקום" להפעלת GPS חי</div></div></section>
</main>
<aside id="drawer" class="drawer"><div class="dh"><div><div class="dt">גזרות ופעולות</div><div class="ds">מפה חיה ו-GPS</div></div><button id="close" class="close">✕</button></div><div class="sec"><h3>מקרא</h3><div id="legend" class="legend"></div></div><div class="sec"><h3>פרטיות</h3><div class="privacy">המיקום נשאר בדפדפן ואינו נשמר בהיסטוריה. קישור נשלח רק כשאתה לוחץ על שליחה.</div></div></aside>
<div id="back" class="back" hidden></div><div id="toast" class="toast"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const sectors={A:{l:'א',n:'גזרה א',c:'#eab308',p:['ספאפרה','בילאל','וורדים','גליל'],x:[[32.7227,35.2851],[32.7278,35.2892],[32.7317,35.2967],[32.7309,35.3058],[32.7276,35.314],[32.724,35.3202],[32.7198,35.318],[32.7184,35.311],[32.7197,35.3047],[32.7188,35.2973],[32.7204,35.291]]},B:{l:'ב',n:'גזרה ב',c:'#3b82f6',p:['שיכון אל ראם','שיכון הפועלים','כפר החורש','אל כרום','כרם סאחב'],x:[[32.7188,35.2845],[32.7212,35.2897],[32.7197,35.2972],[32.7162,35.302],[32.7105,35.3028],[32.7064,35.2984],[32.705,35.2916],[32.7079,35.286],[32.7127,35.2823],[32.7167,35.282]]},C:{l:'ג',n:'גזרה ג',c:'#f97316',p:['ביר אל אמיר','פאחורה','שכונה מזרחית',"ג'בל דולי",'חאלת אל דיר'],x:[[32.7186,35.302],[32.7201,35.3091],[32.7186,35.3171],[32.7145,35.3238],[32.708,35.326],[32.7036,35.321],[32.7003,35.3141],[32.699,35.3079],[32.6947,35.3055],[32.6912,35.3006],[32.6952,35.2973],[32.7012,35.299],[32.7057,35.3023],[32.7109,35.3025],[32.7142,35.3002]]},D:{l:'ד',n:'גזרה ד',c:'#65a30d',p:[],x:[[32.7064,35.2868],[32.7082,35.2928],[32.7057,35.2982],[32.7003,35.2992],[32.6956,35.2955],[32.6911,35.2925],[32.688,35.2852],[32.6874,35.2768],[32.6912,35.2709],[32.6969,35.2695],[32.7014,35.2733],[32.7049,35.2793]]}};
let current=null,last=null,watchId=null,followMode=false,mode='sat',marker=null,accCircle=null;const polys={},labels={};
const map=L.map('map',{zoomControl:true}).setView([32.7085,35.296],13);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
function style(s,a){return{color:s.c,weight:a?4:2.5,opacity:a?1:.92,fillColor:s.c,fillOpacity:a?.42:.28}}
function center(x){let a=0,b=0;x.forEach(p=>{a+=p[0];b+=p[1]});return[a/x.length,b/x.length]}
function draw(){Object.entries(sectors).forEach(([k,s])=>{polys[k]=L.polygon(s.x,style(s,false)).addTo(map);labels[k]=L.marker(center(s.x),{interactive:false,icon:L.divIcon({className:'sector-label',html:`<div>${s.l}</div>`,iconSize:[42,42],iconAnchor:[21,21]})}).addTo(map)});legend.innerHTML=Object.values(sectors).map(s=>`<div class="li"><div class="ll" style="background:${s.c}">${s.l}</div><div><div class="ln">${s.n}</div><div class="lp">${s.p.length?s.p.join(' • '):'ללא רשימת שכונות מאומתת'}</div></div></div>`).join('')}
function pip(lat,lng,p){let z=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][1],yi=p[i][0],xj=p[j][1],yj=p[j][0];if(((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi+1e-12)+xi))z=!z}return z}
function detect(lat,lng){for(const k in sectors)if(pip(lat,lng,sectors[k].x))return k;return null}
function highlight(){for(const k in sectors)polys[k].setStyle(style(sectors[k],k===current))}
function update(pos){const{latitude:lat,longitude:lng,accuracy,heading,speed}=pos.coords;last={lat,lng,accuracy,heading,speed,time:Date.now()};if(!marker){marker=L.marker([lat,lng],{zIndexOffset:2000,icon:L.divIcon({className:'',html:'<div class="udot gpsPulse"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);accCircle=L.circle([lat,lng],{radius:accuracy,color:'#2563eb',weight:1,fillColor:'#60a5fa',fillOpacity:.12}).addTo(map)}else{marker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng]).setRadius(accuracy)}const n=detect(lat,lng);if(n!==current){current=n;highlight();if(navigator.vibrate)navigator.vibrate(40)}renderStatus();shareLoc.disabled=false;shareTop.disabled=false;if(followMode){map.setView([lat,lng],Math.max(map.getZoom(),16),{animate:true})}}
function err(e){let m='לא ניתן לקבל מיקום';if(e.code===1)m='הרשאת מיקום נדחתה';if(e.code===2)m='המיקום אינו זמין';if(e.code===3)m='זמן קבלת המיקום הסתיים';status.textContent='GPS לא זמין';meta.textContent=m;toast(m)}
function startGPS(centerNow=true){if(!navigator.geolocation){err({code:2});return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{update(p);if(centerNow){map.setView([p.coords.latitude,p.coords.longitude],16,{animate:true});centerNow=false}},err,{enableHighAccuracy:true,maximumAge:0,timeout:15000});toast('GPS חי הופעל')}
function renderStatus(){if(!last)return;const age=Math.max(0,Math.round((Date.now()-last.time)/1000)),acc=Math.round(last.accuracy||0);if(current){badge.textContent=sectors[current].l;badge.style.background=sectors[current].c;status.textContent=`אתה נמצא ב${sectors[current].n}`}else{badge.textContent='!';badge.style.background='#dc2626';status.textContent='מחוץ לגבולות הגזרה'}const sp=Number.isFinite(last.speed)?` • ${Math.round(last.speed*3.6)} קמ״ש`:'';meta.textContent=`דיוק GPS כ-${acc} מ׳ • עודכן לפני ${age} שנ׳${sp}`}
function shareNow(){if(!last){toast('אין עדיין מיקום לשיתוף');return}const age=(Date.now()-last.time)/1000;if(age>60){toast('המיקום ישן, מעדכן GPS');startGPS(true);return}const s=current?`גזרה ${sectors[current].l}`:'מחוץ לגבולות הגזרה';const url=`https://www.google.com/maps?q=${last.lat.toFixed(6)},${last.lng.toFixed(6)}`;window.open(`https://wa.me/?text=${encodeURIComponent(`המיקום שלי כרגע:\n${s}\n${url}`)}`,'_blank','noopener')}
function toggleFollow(){followMode=!followMode;follow.classList.toggle('active',followMode);toast(followMode?'מעקב חי הופעל':'מעקב חי הופסק');if(followMode){if(!last)startGPS(true);else map.setView([last.lat,last.lng],Math.max(map.getZoom(),16),{animate:true})}}
function toggleLayer(){if(mode==='sat'){map.removeLayer(sat);street.addTo(map);mode='street';toast('תצוגת מפה')}else{map.removeLayer(street);sat.addTo(map);mode='sat';toast('תצוגת לוויין')}}
function fitAll(){const all=[];Object.values(sectors).forEach(s=>all.push(...s.x));map.fitBounds(L.latLngBounds(all),{padding:[25,25]})}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('show'),2200)}
const hub=document.getElementById('hub'),menuStack=document.getElementById('menuStack'),showLoc=document.getElementById('showLoc'),shareLoc=document.getElementById('shareLoc'),follow=document.getElementById('follow'),layer=document.getElementById('layer'),fit=document.getElementById('fit'),editPoly=document.getElementById('editPoly'),showLocTop=document.getElementById('showLocTop'),shareTop=document.getElementById('shareTop'),badge=document.getElementById('badge'),status=document.getElementById('status'),meta=document.getElementById('meta'),legend=document.getElementById('legend'),toastEl=document.getElementById('toast');
hub.onclick=()=>menuStack.classList.toggle('open');showLoc.onclick=()=>startGPS(true);showLocTop.onclick=()=>startGPS(true);shareLoc.onclick=shareNow;shareTop.onclick=shareNow;follow.onclick=toggleFollow;layer.onclick=toggleLayer;fit.onclick=fitAll;editPoly.onclick=()=>toast('עריכת פוליגונים תיפתח מהתפריט הראשי בגרסה הבאה');
menu.onclick=()=>{drawer.classList.add('open');back.hidden=false};close.onclick=()=>{drawer.classList.remove('open');back.hidden=true};back.onclick=close.onclick;map.on('dragstart',()=>{if(followMode){followMode=false;follow.classList.remove('active')}});draw();fitAll();setInterval(renderStatus,1000);
</script></body></html>
