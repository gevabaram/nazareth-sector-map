<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>מפת גזרות – נצרת והסביבה</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font-family:Arial,system-ui,sans-serif;background:#e2e8f0;color:#0f172a;overflow:hidden}
button,input{font:inherit}.top{height:64px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 14px 0;position:relative;z-index:1000;box-shadow:0 2px 14px #0f172a55}
.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:#ffffff20;display:grid;place-items:center;font-weight:900}.title{font-weight:900;font-size:17px}.sub{font-size:12px;opacity:.72;margin-top:3px}
.menuBtn{width:42px;height:42px;border:0;border-radius:13px;background:#ffffff18;color:#fff;font-size:20px}.wrap{height:calc(100% - 64px);position:relative}#map{height:100%;width:100%}
.quick{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:850;display:flex;gap:8px;white-space:nowrap}
.mini{height:38px;border:0;border-radius:12px;color:#fff;box-shadow:0 8px 24px #0f172a2e;padding:0 13px;font-weight:900;font-size:12px}.mini.primary{background:#2563eb}.mini.green{background:#16a34a}.mini:disabled{opacity:.45}
.controlCluster{position:absolute;right:14px;top:64px;z-index:900;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.hub{width:52px;height:52px;border:0;border-radius:16px;background:#0f172a;color:#fff;box-shadow:0 12px 28px #0f172a55;font-size:22px}
.menuStack{display:none;flex-direction:column;gap:8px}.menuStack.open{display:flex}.actionBtn{width:170px;min-height:52px;border:1px solid #dbe3ed;border-radius:14px;background:#ffffffef;box-shadow:0 8px 20px #0f172a22;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;padding:8px 10px;text-align:right}
.actionBtn .ico{width:32px;height:32px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-size:16px}.actionBtn b{display:block;font-size:13px}.actionBtn small{display:block;color:#64748b;font-size:10px;line-height:1.2;margin-top:2px}
.statusCard{position:absolute;z-index:850;right:14px;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#fffffff5;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 14px 40px #0f172a2e;padding:10px 12px;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;backdrop-filter:blur(10px)}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#475569;color:#fff;font-weight:900;font-size:21px;border:4px solid #ffffffcc}.status{font-weight:900;font-size:15px}.meta{font-size:11px;color:#64748b;margin-top:4px}
.sector-label div{width:42px;height:42px;border-radius:50%;background:#0b0b0b;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;border:3px solid #ffffffdd;box-shadow:0 4px 12px #0004}.udot{width:20px;height:20px;background:#2563eb;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 8px #2563eb33,0 3px 10px #0004}
.sectorPicker{position:absolute;z-index:980;top:126px;right:14px;width:240px;background:#fffffff7;border:1px solid #dbe3ed;border-radius:18px;box-shadow:0 14px 36px #0f172a33;padding:12px;backdrop-filter:blur(10px);display:none}.sectorPicker.open{display:block}.sectorPicker h3{margin:0 0 4px;font-size:14px}.hint{font-size:10px;color:#64748b;margin-bottom:10px}.pickRow{display:flex;align-items:center;gap:9px;padding:9px 6px;border-radius:11px}.pickRow input{width:18px;height:18px}.pickSwatch{width:22px;height:22px;border-radius:7px}.pickText{font-size:12px;font-weight:800;flex:1}.pickAll{border-bottom:1px solid #e2e8f0;margin-bottom:4px}.pickerClose{width:100%;height:34px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-size:11px;font-weight:800;margin-top:8px}
.editor{position:absolute;z-index:1100;top:78px;right:12px;left:12px;background:#fffffff8;border:1px solid #cbd5e1;border-radius:20px;box-shadow:0 18px 48px #0f172a40;padding:12px;display:none;backdrop-filter:blur(12px)}.editor.open{display:block}
.editorHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.editorTitle{font-size:15px;font-weight:900}.editorClose{width:34px;height:34px;border:0;border-radius:10px;background:#e2e8f0;font-weight:900}
.sectorTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.sectorTab{height:42px;border:2px solid transparent;border-radius:12px;color:white;font-weight:900;font-size:15px;opacity:.68}.sectorTab.active{opacity:1;border-color:#0f172a;box-shadow:0 0 0 2px white inset}
.editStatus{font-size:12px;font-weight:800;margin:4px 0 10px}.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modeBtn{height:40px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-weight:900}.modeBtn.active{background:#0f172a;color:#fff}
.sliderRow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;margin-top:10px}.sliderRow input{width:100%}.sizeValue{font-size:12px;font-weight:900;min-width:52px}
.editorActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.smallBtn{height:36px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font-size:11px;font-weight:900}.smallBtn.save{background:#16a34a;color:#fff;border-color:#16a34a}
.drawOverlay{position:absolute;inset:0;z-index:1050;display:none;touch-action:none;cursor:crosshair}.drawOverlay.on{display:block}.brushCursor{position:absolute;border:2px solid #0f172a;background:#ffffff33;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:1150}
.toast{position:fixed;z-index:1500;left:50%;bottom:100px;transform:translate(-50%,15px);opacity:0;background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.quick .mini{height:36px;padding:0 10px;font-size:11px}.actionBtn{width:160px}.statusCard{right:12px;left:12px;bottom:calc(10px + env(safe-area-inset-bottom))}.editor{top:72px}}
</style>
</head>
<body><div id="app">
<header class="top"><div class="brand"><div class="mark">מג</div><div><div class="title">מפת גזרות</div><div class="sub">נצרת • ריינה • יפיע • עילוט</div></div></div><button id="menu" class="menuBtn">☰</button></header>
<main class="wrap">
<div id="map"></div>
<div class="quick"><button id="showLocTop" class="mini primary">הצג מיקום</button><button id="shareTop" class="mini green" disabled>שלח מיקום</button></div>
<div class="controlCluster"><button id="hub" class="hub" aria-label="פתח כלים">☰</button><div id="menuStack" class="menuStack">
<button id="layer" class="actionBtn"><span class="ico">▧</span><span><b>מפה / לוויין</b><small>החלפת סוג התצוגה</small></span></button>
<button id="fit" class="actionBtn"><span class="ico">◉</span><span><b>בחירת פוליגונים</b><small>הצג גזרה אחת, כמה או את כולן</small></span></button>
<button id="editPoly" class="actionBtn"><span class="ico">✎</span><span><b>עריכת פוליגונים</b><small>מברשת, מחק ובחירת גזרה</small></span></button>
</div></div>

<div id="sectorPicker" class="sectorPicker"><h3>בחירת פוליגונים</h3><div class="hint">אפשר לבחור כמה גזרות במקביל</div><label class="pickRow pickAll"><input id="pickAll" type="checkbox" checked><span class="pickText">הצג את כל הגזרות</span></label><div id="pickList"></div><button id="pickerClose" class="pickerClose">סגור</button></div>

<div id="editor" class="editor">
  <div class="editorHead"><div><div class="editorTitle">עריכת גבולות גזרה</div><div class="hint">בחר גזרה אחת. כל צביעה/מחיקה תשפיע רק עליה.</div></div><button id="editorClose" class="editorClose">✕</button></div>
  <div id="sectorTabs" class="sectorTabs"></div>
  <div id="editStatus" class="editStatus"></div>
  <div class="modeRow"><button id="paintMode" class="modeBtn active">🖌️ צביעה</button><button id="eraseMode" class="modeBtn">⌫ מחיקה</button></div>
  <div class="sliderRow"><span>גודל מברשת</span><input id="brushSize" type="range" min="20" max="300" step="10" value="80"><span id="sizeValue" class="sizeValue">80 מ׳</span></div>
  <div class="editorActions"><button id="undoBtn" class="smallBtn">בטל</button><button id="resetSectorBtn" class="smallBtn">אפס גזרה</button><button id="saveEditBtn" class="smallBtn save">שמור</button></div>
</div>
<div id="drawOverlay" class="drawOverlay"></div><div id="brushCursor" class="brushCursor"></div>

<section class="statusCard"><div id="badge" class="badge">—</div><div><div id="status" class="status">מאתר את המיקום שלך…</div><div id="meta" class="meta">המיקום יתעדכן אוטומטית בזמן אמת</div></div></section>
</main>
<div id="toast" class="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script>
const defaults={
 A:{l:'א',n:'גזרה א',c:'#eab308',p:['ספאפרה','בילאל','וורדים','גליל'],x:[[32.7227,35.2851],[32.7278,35.2892],[32.7317,35.2967],[32.7309,35.3058],[32.7276,35.314],[32.724,35.3202],[32.7198,35.318],[32.7184,35.311],[32.7197,35.3047],[32.7188,35.2973],[32.7204,35.291]]},
 B:{l:'ב',n:'גזרה ב',c:'#3b82f6',p:['שיכון אל ראם','שיכון הפועלים','כפר החורש','אל כרום','כרם סאחב'],x:[[32.7188,35.2845],[32.7212,35.2897],[32.7197,35.2972],[32.7162,35.302],[32.7105,35.3028],[32.7064,35.2984],[32.705,35.2916],[32.7079,35.286],[32.7127,35.2823],[32.7167,35.282]]},
 C:{l:'ג',n:'גזרה ג',c:'#f97316',p:['ביר אל אמיר','פאחורה','שכונה מזרחית',"ג'בל דולי",'חאלת אל דיר'],x:[[32.7186,35.302],[32.7201,35.3091],[32.7186,35.3171],[32.7145,35.3238],[32.708,35.326],[32.7036,35.321],[32.7003,35.3141],[32.699,35.3079],[32.6947,35.3055],[32.6912,35.3006],[32.6952,35.2973],[32.7012,35.299],[32.7057,35.3023],[32.7109,35.3025],[32.7142,35.3002]]},
 D:{l:'ד',n:'גזרה ד',c:'#65a30d',p:[],x:[[32.7064,35.2868],[32.7082,35.2928],[32.7057,35.2982],[32.7003,35.2992],[32.6956,35.2955],[32.6911,35.2925],[32.688,35.2852],[32.6874,35.2768],[32.6912,35.2709],[32.6969,35.2695],[32.7014,35.2733],[32.7049,35.2793]]}
};
const sectors=JSON.parse(JSON.stringify(defaults));
let savedGeo={};try{savedGeo=JSON.parse(localStorage.getItem('sectorGeoV2')||'{}')}catch(e){}
let current=null,last=null,watchId=null,mode='sat',marker=null,accCircle=null,firstFix=true,editing=false,editKey='A',editMode='paint',brushMeters=80,drawing=false,lastDrawAt=0;
const visibleSectors=new Set(Object.keys(sectors)), polys={}, labels={}, history={A:[],B:[],C:[],D:[]};
const map=L.map('map',{zoomControl:true}).setView([32.7085,35.296],13);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);

function coordsToFeature(x){const ring=x.map(([lat,lng])=>[lng,lat]);ring.push(ring[0]);return turf.polygon([ring])}
const features={};Object.keys(sectors).forEach(k=>features[k]=savedGeo[k]||coordsToFeature(sectors[k].x));
function featureCenter(f){const c=turf.centerOfMass(f).geometry.coordinates;return[c[1],c[0]]}
function style(s,a){return{color:s.c,weight:a?4:2.5,opacity:a?1:.92,fillColor:s.c,fillOpacity:a?.42:.28}}
function redrawOne(k){
 if(polys[k])map.removeLayer(polys[k]);if(labels[k])map.removeLayer(labels[k]);
 if(!visibleSectors.has(k))return;
 const s=sectors[k], f=features[k]; if(!f)return;
 polys[k]=L.geoJSON(f,{style:()=>style(s,k===current)}).addTo(map);
 labels[k]=L.marker(featureCenter(f),{interactive:false,icon:L.divIcon({className:'sector-label',html:`<div>${s.l}</div>`,iconSize:[42,42],iconAnchor:[21,21]})}).addTo(map)
}
function redrawAll(){Object.keys(sectors).forEach(redrawOne)}
function detect(lat,lng){const pt=turf.point([lng,lat]);for(const k of Object.keys(sectors))if(features[k]&&turf.booleanPointInPolygon(pt,features[k]))return k;return null}
function highlight(){Object.keys(sectors).forEach(k=>{if(polys[k])polys[k].setStyle(style(sectors[k],k===current))})}
function update(pos){
 const{latitude:lat,longitude:lng,accuracy}=pos.coords;last={lat,lng,accuracy,time:Date.now(),speed:pos.coords.speed};
 if(!marker){marker=L.marker([lat,lng],{zIndexOffset:2000,icon:L.divIcon({className:'',html:'<div class="udot"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);accCircle=L.circle([lat,lng],{radius:accuracy,color:'#2563eb',weight:1,fillColor:'#60a5fa',fillOpacity:.12}).addTo(map)}else{marker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng]).setRadius(accuracy)}
 current=detect(lat,lng);highlight();statusUpdate();shareTop.disabled=false;if(firstFix){map.setView([lat,lng],16);firstFix=false}else map.panTo([lat,lng],{animate:true,duration:.4})
}
function locErr(e){status.textContent='שירותי המיקום אינם פעילים';meta.textContent=e.code===1?'אפשר הרשאת מיקום בדפדפן כדי להציג אותך על המפה':'לא ניתן לקבל מיקום כרגע';badge.textContent='!';badge.style.background='#dc2626'}
function startGPS(){if(!navigator.geolocation)return locErr({code:2});if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(update,locErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function statusUpdate(){if(!last)return;const age=Math.max(0,Math.round((Date.now()-last.time)/1000)),acc=Math.round(last.accuracy||0);if(current){const s=sectors[current];badge.textContent=s.l;badge.style.background=s.c;status.textContent=`אתה נמצא ב${s.n}`;meta.textContent=`דיוק כ-${acc} מ׳ • עדכון לפני ${age} שנ׳`}else{badge.textContent='!';badge.style.background='#dc2626';status.textContent='מחוץ לגבולות הגזרה';meta.textContent=`דיוק כ-${acc} מ׳ • עדכון לפני ${age} שנ׳`}}
function showMe(){if(last)map.setView([last.lat,last.lng],17);else startGPS()}
function shareMe(){if(!last)return toast('עדיין אין מיקום לשיתוף');const url=`https://www.google.com/maps?q=${last.lat.toFixed(6)},${last.lng.toFixed(6)}`,st=current?`\nגזרה: ${sectors[current].l}`:'\nמחוץ לגבולות הגזרה',txt=`המיקום שלי כרגע:${st}\n${url}`;window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank')}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}
const toastEl=document.getElementById('toast');

function buildPicker(){pickList.innerHTML='';Object.entries(sectors).forEach(([k,s])=>{const row=document.createElement('label');row.className='pickRow';row.innerHTML=`<input type="checkbox" data-k="${k}" checked><span class="pickSwatch" style="background:${s.c}"></span><span class="pickText">${s.n}</span>`;pickList.appendChild(row)});pickList.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.k;cb.checked?visibleSectors.add(k):visibleSectors.delete(k);pickAll.checked=visibleSectors.size===4;redrawOne(k)})}
pickAll.onchange=()=>{Object.keys(sectors).forEach(k=>pickAll.checked?visibleSectors.add(k):visibleSectors.delete(k));pickList.querySelectorAll('input').forEach(x=>x.checked=pickAll.checked);redrawAll()};

function buildEditorTabs(){sectorTabs.innerHTML='';Object.entries(sectors).forEach(([k,s])=>{const b=document.createElement('button');b.className='sectorTab'+(k===editKey?' active':'');b.style.background=s.c;b.textContent=s.l;b.onclick=()=>selectEditSector(k);sectorTabs.appendChild(b)});updateEditStatus()}
function selectEditSector(k){editKey=k;buildEditorTabs();toast(`עורך כעת את ${sectors[k].n}`)}
function updateEditStatus(){editStatus.textContent=`עורך כעת: ${sectors[editKey].n} (${sectors[editKey].l}) • ${editMode==='paint'?'צביעה':'מחיקה'} • מברשת ${brushMeters} מ׳`}
function openEditor(){editing=true;editor.classList.add('open');drawOverlay.classList.add('on');menuStack.classList.remove('open');sectorPicker.classList.remove('open');buildEditorTabs();updateBrushCursor();toast(`מצב עריכה: ${sectors[editKey].n}`)}
function closeEditor(){editing=false;editor.classList.remove('open');drawOverlay.classList.remove('on');brushCursor.style.display='none'}
function saveGeometry(){const data={};Object.keys(features).forEach(k=>data[k]=features[k]);localStorage.setItem('sectorGeoV2',JSON.stringify(data));toast('הגבולות נשמרו במכשיר')}
function snapshot(k){history[k].push(JSON.stringify(features[k]));if(history[k].length>20)history[k].shift()}
function undo(){const h=history[editKey];if(!h.length)return toast('אין פעולה לביטול');features[editKey]=JSON.parse(h.pop());redrawOne(editKey);toast('הפעולה האחרונה בוטלה')}
function resetSector(){snapshot(editKey);features[editKey]=coordsToFeature(defaults[editKey].x);redrawOne(editKey);toast(`${sectors[editKey].n} אופסה`)}

function applyBrush(latlng){
 const now=Date.now();if(now-lastDrawAt<85)return;lastDrawAt=now;
 const base=features[editKey], brush=turf.buffer(turf.point([latlng.lng,latlng.lat]),brushMeters,{units:'meters',steps:16});
 try{
   let out;
   if(editMode==='paint') out=turf.union(base,brush);
   else out=turf.difference(base,brush);
   if(out){features[editKey]=out;redrawOne(editKey)}
 }catch(e){console.warn(e)}
}
function eventPoint(e){const r=drawOverlay.getBoundingClientRect();return L.point(e.clientX-r.left,e.clientY-r.top)}
function updateBrushCursor(e){
 if(!editing)return;
 if(e){const p=eventPoint(e);brushCursor.style.left=p.x+'px';brushCursor.style.top=p.y+'px'}
 const center=map.getCenter(), p1=map.latLngToContainerPoint(center), dest=turf.destination(turf.point([center.lng,center.lat]),brushMeters/1000,90,{units:'kilometers'}).geometry.coordinates, p2=map.latLngToContainerPoint([dest[1],dest[0]]);
 const px=Math.max(16,Math.abs(p2.x-p1.x)*2);brushCursor.style.width=px+'px';brushCursor.style.height=px+'px';brushCursor.style.display='block';brushCursor.style.borderColor=editMode==='paint'?sectors[editKey].c:'#dc2626'
}
drawOverlay.addEventListener('pointerdown',e=>{if(!editing)return;drawing=true;drawOverlay.setPointerCapture(e.pointerId);snapshot(editKey);const p=eventPoint(e),ll=map.containerPointToLatLng(p);applyBrush(ll);updateBrushCursor(e);e.preventDefault()});
drawOverlay.addEventListener('pointermove',e=>{if(!editing)return;updateBrushCursor(e);if(drawing){const p=eventPoint(e),ll=map.containerPointToLatLng(p);applyBrush(ll)}e.preventDefault()});
drawOverlay.addEventListener('pointerup',e=>{drawing=false;try{drawOverlay.releasePointerCapture(e.pointerId)}catch(x){}});
drawOverlay.addEventListener('pointercancel',()=>drawing=false);

brushSize.oninput=()=>{brushMeters=+brushSize.value;sizeValue.textContent=brushMeters+' מ׳';updateEditStatus();updateBrushCursor()}
paintMode.onclick=()=>{editMode='paint';paintMode.classList.add('active');eraseMode.classList.remove('active');updateEditStatus();updateBrushCursor()}
eraseMode.onclick=()=>{editMode='erase';eraseMode.classList.add('active');paintMode.classList.remove('active');updateEditStatus();updateBrushCursor()}
undoBtn.onclick=undo;resetSectorBtn.onclick=resetSector;saveEditBtn.onclick=saveGeometry;editorClose.onclick=closeEditor;

hub.onclick=()=>menuStack.classList.toggle('open');layer.onclick=()=>{if(mode==='sat'){map.removeLayer(sat);street.addTo(map);mode='street';toast('תצוגת מפה')}else{map.removeLayer(street);sat.addTo(map);mode='sat';toast('תצוגת לוויין')}};
fit.onclick=()=>{sectorPicker.classList.toggle('open');menuStack.classList.remove('open')};pickerClose.onclick=()=>sectorPicker.classList.remove('open');editPoly.onclick=openEditor;
showLocTop.onclick=showMe;shareTop.onclick=shareMe;menu.onclick=()=>toast('כלי המפה נמצאים בכפתור ☰ שעל המפה');

buildPicker();redrawAll();startGPS();setInterval(statusUpdate,1000);
</script>
</body></html>
