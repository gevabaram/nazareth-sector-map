name: Add editor password protection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-editor-password.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect polygon editor with password
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="passwordModal"' in s:
              print('Password protection already present')
              raise SystemExit(0)

          css='''.passwordModal{position:fixed;inset:0;z-index:2200;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.52);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.passwordModal.open{display:flex}.passwordCard{width:min(340px,92vw);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(241,245,249,.82));box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 24px 70px rgba(15,23,42,.35);text-align:right}.passwordTitle{font-size:18px;font-weight:900;margin-bottom:5px}.passwordHint{font-size:12px;color:#64748b;margin-bottom:14px}.passwordInput{width:100%;height:48px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;padding:0 14px;font-size:20px;text-align:center;letter-spacing:5px;outline:none}.passwordInput:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.passwordActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.passwordBtn{height:42px;border:0;border-radius:12px;font-weight:900}.passwordBtn.cancel{background:#e2e8f0;color:#0f172a}.passwordBtn.ok{background:linear-gradient(145deg,#2563eb,#1d4ed8);color:#fff}.passwordError{min-height:18px;color:#dc2626;font-size:11px;font-weight:700;margin-top:8px;text-align:center}'''
          s=s.replace('@media(max-width:640px)',css+'@media(max-width:640px)',1)

          modal='''<div id="passwordModal" class="passwordModal" aria-hidden="true"><div class="passwordCard"><div class="passwordTitle">הזן סיסמה</div><div class="passwordHint">העריכה, השינוי והמחיקה מוגנים בסיסמה.</div><input id="passwordInput" class="passwordInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••"><div id="passwordError" class="passwordError"></div><div class="passwordActions"><button id="passwordCancel" class="passwordBtn cancel">ביטול</button><button id="passwordSubmit" class="passwordBtn ok">אישור</button></div></div></div>\n'''
          s=s.replace('<section class="statusCard">',modal+'<section class="statusCard">',1)

          old="function openEditor(){editing=true;editor.classList.add('open');drawOverlay.classList.add('on');menuStack.classList.remove('open');sectorPicker.classList.remove('open');buildEditorTabs();updateBrushCursor();toast(`מצב עריכה: ${sectors[editKey].n}`)}"
          new="function actuallyOpenEditor(){editing=true;editor.classList.add('open');drawOverlay.classList.add('on');menuStack.classList.remove('open');sectorPicker.classList.remove('open');buildEditorTabs();updateBrushCursor();toast(`מצב עריכה: ${sectors[editKey].n}`)}\nfunction openEditor(){menuStack.classList.remove('open');passwordError.textContent='';passwordInput.value='';passwordModal.classList.add('open');passwordModal.setAttribute('aria-hidden','false');setTimeout(()=>passwordInput.focus(),80)}\nfunction closePassword(){passwordModal.classList.remove('open');passwordModal.setAttribute('aria-hidden','true');passwordInput.value='';passwordError.textContent=''}\nfunction submitPassword(){if(passwordInput.value==='66'){closePassword();actuallyOpenEditor()}else{passwordError.textContent='סיסמה שגויה';passwordInput.select();if(navigator.vibrate)navigator.vibrate(80)}}"
          if old not in s:
              raise SystemExit('openEditor function not found; refusing unsafe patch')
          s=s.replace(old,new,1)

          bind="passwordSubmit.onclick=submitPassword;passwordCancel.onclick=closePassword;passwordInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitPassword();if(e.key==='Escape')closePassword()});passwordModal.addEventListener('click',e=>{if(e.target===passwordModal)closePassword()});\n\n"
          s=s.replace("hub.onclick=()=>menuStack.classList.toggle('open');",bind+"hub.onclick=()=>menuStack.classList.toggle('open');",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit protected editor
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Protect polygon editing with password"
          git push
