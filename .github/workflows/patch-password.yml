name: Patch polygon editor password

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_password.py
      - .github/workflows/patch-password.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply password protection
        run: python3 scripts/patch_password.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Protect polygon editing with password"
          git push
