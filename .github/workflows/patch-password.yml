name: Prepare Firebase cloud sync

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_password.py
      - .github/workflows/patch-password.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Firebase files and patch app
        run: python3 scripts/patch_password.py
      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain -- index.html firebase-config.js firebase-sync.js firestore.rules firebase.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firebase-config.js firebase-sync.js firestore.rules firebase.json
          git commit -m "Connect shared polygons to Firebase Firestore"
          git push
