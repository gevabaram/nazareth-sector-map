name: Patch Firebase loader
on:
  push:
    paths:
      - 'scripts/patch_firebase.py'
      - '.github/workflows/patch-firebase.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Firebase loader
        run: python3 scripts/patch_firebase.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect app to Firebase Firestore"
          git push
