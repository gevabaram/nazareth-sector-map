name: Deploy Firebase Backend

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/firebase-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing FIREBASE_SERVICE_ACCOUNT" && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Configure editor secret
        env:
          EDITOR_CODE: ${{ secrets.EDITOR_CODE }}
        run: |
          test -n "$EDITOR_CODE" || (echo "Missing EDITOR_CODE" && exit 1)
          printf '%s' "$EDITOR_CODE" | firebase functions:secrets:set EDITOR_CODE --project polygon-app-e7c11 --force
      - name: Deploy Firestore rules and backend
        run: firebase deploy --only firestore:rules,functions:publishPolygons --project polygon-app-e7c11 --non-interactive
